[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "openrouter-assistant"
version = "0.1.0"
description = "Ejemplo de asistente con LangChain y OpenRouter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0,<2",
    "langchain-openrouter>=0.1,<1",
    "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
ai-chat = "openrouter_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openrouter_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
